name: Deploy Server

# 流程：GitHub Runner 构建镜像 → 推送国内仓库（默认阿里云 ACR）→ 服务器2 从国内源拉取
# 关键点：registry 是分层增量传输，每次部署只上传变化的层（几 MB），
#         而不是像 docker save 那样每次全量 100MB+ 穿越国际链路。
# 服务器2 永远不执行 docker build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # 主仓库地址：阿里云 ACR 个人版（实例专属域名，不是通用 registry.cn-*.aliyuncs.com）
  # 换源只需设置仓库变量 IMAGE_REGISTRY / IMAGE_REPO，Secret 名不变
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'crpi-m0whm1exhoe5bb6c.cn-guangzhou.personal.cr.aliyuncs.com' }}
  IMAGE: ${{ vars.IMAGE_REPO || 'crpi-m0whm1exhoe5bb6c.cn-guangzhou.personal.cr.aliyuncs.com/whitz/server' }}
  # 备份仓库（GitHub 内网推送只需几秒，国内拉取慢，仅兜底）
  IMAGE_GHCR: ghcr.io/glassous/whitz-server
  REMOTE_DIR: /opt/whitz
  COMPOSE_FILE: docker-compose.prod.yml
  PROJECT: whitz

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login GHCR (backup)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE_GHCR }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_GHCR }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Restart on Server2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          timeout: 60s

      - name: Pull image & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          PROJECT: ${{ env.PROJECT }}
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          command_timeout: 15m
          envs: IMAGE,REGISTRY,REGISTRY_USER,REGISTRY_PASSWORD,REMOTE_DIR,COMPOSE_FILE,PROJECT
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            test -f .env || { echo "缺少 $REMOTE_DIR/.env（参考 .env.example 手工创建）"; exit 1; }

            # 权限自检：SSH 用户必须能免 sudo 使用 docker
            if ! docker info >/dev/null 2>&1; then
              echo "当前用户无 docker 权限：sudo usermod -aG docker $(id -un) 后重新登录"
              exit 1
            fi

            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            export WHITZ_SERVER_IMAGE="$IMAGE"

            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" pull server
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            ok=0
            for i in $(seq 1 40); do
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T server \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "健康检查失败，最近日志："
              docker compose -p "$PROJECT" -f "$COMPOSE_FILE" logs --tail=100 server || true
              exit 1
            fi

            docker image prune -f --filter "dangling=true" >/dev/null 2>&1 || true
            echo "server deployed: $IMAGE @ $(date -u +%FT%TZ)"
