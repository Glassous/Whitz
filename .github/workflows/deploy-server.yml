name: Deploy Server

# 流程：GitHub Runner 构建镜像 → 推国内仓库（默认阿里云 ACR 公网地址，可自动降级 GHCR）→ 服务器2 pull + up
# registry 是分层增量传输，每次只上传变化的层（几 MB），不是 docker save 那种每次全量。
# 服务器2 永远不执行 docker build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # 阿里云 ACR 个人版「公网地址」（不要用 -vpc 那个，那是阿里云 VPC 内网域名）
  # 换源可通过仓库变量覆盖，Secret 名不变
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'crpi-m8whm1ehxoe5b6bc.cn-guangzhou.personal.cr.aliyuncs.com' }}
  IMAGE: ${{ vars.IMAGE_REPO || 'crpi-m8whm1ehxoe5b6bc.cn-guangzhou.personal.cr.aliyuncs.com/whitz/server' }}
  # 备份仓库：GitHub Runner 推送只需几秒
  IMAGE_GHCR: ghcr.io/glassous/whitz-server
  REMOTE_DIR: /opt/whitz
  COMPOSE_FILE: docker-compose.prod.yml
  PROJECT: whitz

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ACR 个人版域名在境外可能解析不到，先探测，避免整条流水线卡死
      - name: Probe registry DNS
        id: probe
        run: |
          set -uo pipefail
          if getent hosts "$REGISTRY" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "registry $REGISTRY 可解析"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$REGISTRY 在 GitHub Runner 上无法解析，本次自动降级为只推 GHCR"
          fi

      - name: Pick deploy image
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ steps.probe.outputs.ok }}" = "true" ]; then
            echo "image=$IMAGE:${{ steps.meta.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=$IMAGE_GHCR:${{ steps.meta.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ACR
        if: ${{ steps.probe.outputs.ok == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push (ACR + GHCR)
        if: ${{ steps.probe.outputs.ok == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE_GHCR }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_GHCR }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (GHCR only)
        if: ${{ steps.probe.outputs.ok != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_GHCR }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Restart on Server2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          timeout: 60s

      - name: Pull image & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          PROJECT: ${{ env.PROJECT }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          command_timeout: 30m
          envs: IMAGE,REMOTE_DIR,COMPOSE_FILE,PROJECT,REGISTRY_USER,REGISTRY_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            test -f .env || { echo "缺少 $REMOTE_DIR/.env（参考 .env.example 手工创建）"; exit 1; }

            # 权限自检：SSH 用户必须能免 sudo 使用 docker
            if ! docker info >/dev/null 2>&1; then
              echo "当前用户无 docker 权限：sudo usermod -aG docker $(id -un) 后重新登录"
              exit 1
            fi

            REGISTRY="${IMAGE%%/*}"
            if [ "$REGISTRY" = "ghcr.io" ]; then
              echo "using GHCR (fallback)"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "using $REGISTRY"
              echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            fi

            export WHITZ_SERVER_IMAGE="$IMAGE"
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" pull server
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            ok=0
            for i in $(seq 1 40); do
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T server \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "健康检查失败，最近日志："
              docker compose -p "$PROJECT" -f "$COMPOSE_FILE" logs --tail=100 server || true
              exit 1
            fi

            docker image prune -f --filter "dangling=true" >/dev/null 2>&1 || true
            echo "server deployed: $IMAGE @ $(date -u +%FT%TZ)"
