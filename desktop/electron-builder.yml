appId: com.whitz.desktop
productName: Whitz
copyright: Copyright © 2026 Whitz

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asarUnpack:
  - "**/node_modules/better-sqlite3/**"

extraResources:
  - from: resources
    to: .
    filter:
      - app-config.json
      - policy_pubkey.pem
      - icon.ico

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Whitz-${version}-${arch}.${ext}
  # 生产签名：设置 CSC_LINK / CSC_KEY_PASSWORD 环境变量后由 electron-builder 自动签名

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Whitz
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

publish:
  provider: generic
  url: https://whitz.fiacloud.top/desktop
  channel: latest
