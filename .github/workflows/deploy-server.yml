name: Deploy Backend (Server & Agent)

# 流程：GitHub Runner 并行构建 whitz-server 与 whitz-agent 镜像 → 推阿里云 ACR（自动降级 GHCR）→ 服务器2 pull + up
# registry 是分层增量传输，每次只上传变化的层（几 MB），不是 docker save 那种每次全量。
# 服务器2 永远不执行 docker build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "agent/**"
      - "shared/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # 阿里云 ACR 个人版「公网地址」（不要用 -vpc 那个，那是阿里云 VPC 内网域名）
  # 换源可通过仓库变量覆盖，Secret 名不变
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'crpi-m8whm1ehxoe5b6bc.cn-guangzhou.personal.cr.aliyuncs.com' }}
  SERVER_IMAGE: ${{ vars.IMAGE_REPO || 'crpi-m8whm1ehxoe5b6bc.cn-guangzhou.personal.cr.aliyuncs.com/whitz/server' }}
  AGENT_IMAGE: ${{ vars.AGENT_IMAGE_REPO || 'crpi-m8whm1ehxoe5b6bc.cn-guangzhou.personal.cr.aliyuncs.com/whitz/agent' }}
  # 备份仓库：GitHub Runner 推送只需几秒
  SERVER_IMAGE_GHCR: ghcr.io/glassous/whitz-server
  AGENT_IMAGE_GHCR: ghcr.io/glassous/whitz-agent
  REMOTE_DIR: /opt/whitz
  COMPOSE_FILE: docker-compose.prod.yml
  PROJECT: whitz

jobs:
  meta:
    name: Prepare Metadata & Probe Registry
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      acr_ok: ${{ steps.probe.outputs.ok }}
    steps:
      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ACR 个人版域名在境外可能解析不到，先探测，避免整条流水线卡死
      - name: Probe registry DNS
        id: probe
        run: |
          set -uo pipefail
          if getent hosts "$REGISTRY" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "registry $REGISTRY 可解析"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$REGISTRY 在 GitHub Runner 上无法解析，本次自动降级为只推 GHCR"
          fi

  build:
    name: Build & Push (${{ matrix.component }})
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: server
            context: .
            dockerfile: ./server/Dockerfile
          - component: agent
            context: .
            dockerfile: ./agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ACR
        if: ${{ needs.meta.outputs.acr_ok == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Prepare image tags
        id: tags
        run: |
          set -euo pipefail
          if [ "${{ matrix.component }}" = "server" ]; then
            ACR_REPO="$SERVER_IMAGE"
            GHCR_REPO="$SERVER_IMAGE_GHCR"
          else
            ACR_REPO="$AGENT_IMAGE"
            GHCR_REPO="$AGENT_IMAGE_GHCR"
          fi
          {
            echo "tags<<EOF"
            if [ "${{ needs.meta.outputs.acr_ok }}" = "true" ]; then
              echo "${ACR_REPO}:${{ needs.meta.outputs.tag }}"
              echo "${ACR_REPO}:latest"
            fi
            echo "${GHCR_REPO}:${{ needs.meta.outputs.tag }}"
            echo "${GHCR_REPO}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # ACR 个人版不接受 BuildKit 生成的 attestation（OCI empty descriptor），必须关闭
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Pull & Restart on Server2
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy images
        id: images
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          if [ "${{ needs.meta.outputs.acr_ok }}" = "true" ]; then
            echo "server=${SERVER_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "agent=${AGENT_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "server=${SERVER_IMAGE_GHCR}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "agent=${AGENT_IMAGE_GHCR}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          timeout: 60s

      - name: Pull images & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SERVER_IMAGE: ${{ steps.images.outputs.server }}
          DEPLOY_AGENT_IMAGE: ${{ steps.images.outputs.agent }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          PROJECT: ${{ env.PROJECT }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_SERVER_IMAGE,DEPLOY_AGENT_IMAGE,REMOTE_DIR,COMPOSE_FILE,PROJECT,REGISTRY_USER,REGISTRY_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            test -f .env || { echo "缺少 $REMOTE_DIR/.env（参考 .env.example 手工创建）"; exit 1; }

            # 权限自检：SSH 用户必须能免 sudo 使用 docker
            if ! docker info >/dev/null 2>&1; then
              echo "当前用户无 docker 权限：sudo usermod -aG docker $(id -un) 后重新登录"
              exit 1
            fi

            REGISTRY="${DEPLOY_SERVER_IMAGE%%/*}"
            if [ "$REGISTRY" = "ghcr.io" ]; then
              echo "using GHCR (fallback)"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "using $REGISTRY"
              echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            fi

            export WHITZ_SERVER_IMAGE="$DEPLOY_SERVER_IMAGE"
            export WHITZ_AGENT_IMAGE="$DEPLOY_AGENT_IMAGE"
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" pull server agent-api agent-worker
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            ok=0
            for i in $(seq 1 40); do
              server_ok=0
              agent_ok=0
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T server \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                server_ok=1
              fi
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T agent-api \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                agent_ok=1
              fi
              if [ "$server_ok" = "1" ] && [ "$agent_ok" = "1" ]; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "健康检查失败，最近日志："
              docker compose -p "$PROJECT" -f "$COMPOSE_FILE" logs --tail=80 server agent-api agent-worker || true
              exit 1
            fi

            docker image prune -f --filter "dangling=true" >/dev/null 2>&1 || true
            echo "deployed: server=$WHITZ_SERVER_IMAGE agent=$WHITZ_AGENT_IMAGE @ $(date -u +%FT%TZ)"
