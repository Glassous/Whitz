[project]
name = "whitz-server"
version = "0.1.0"
description = "Whitz multi-tenant personal agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "email-validator>=2.0",
    "redis>=5.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "cryptography>=43.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]