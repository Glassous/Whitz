appId: com.whitz.desktop
productName: Whitz
copyright: Copyright © 2026 Whitz
compression: maximum
electronLanguages:
  - zh-CN
  - en-US

directories:
  output: release
  buildResources: resources

afterPack: scripts/after-pack.cjs

files:
  - out/**/*
  - package.json
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/build/Release/obj/**"
  - "!node_modules/better-sqlite3/build/Release/*.pdb"
  - "!node_modules/better-sqlite3/build/Release/*.lib"
  - "!node_modules/better-sqlite3/build/Release/*.exp"
  - "!node_modules/better-sqlite3/build/Release/*.iobj"
  - "!node_modules/better-sqlite3/build/Release/*.ipdb"
  - "!node_modules/**/*.{map,d.ts,d.cts,d.mts,ts,mts,cts}"
  - "!node_modules/**/{README,CHANGELOG,HISTORY,CONTRIBUTING,AUTHORS}*"
  - "!node_modules/**/{test,tests,__tests__,example,examples,docs}/**"

asarUnpack:
  - "**/node_modules/better-sqlite3/**"

extraResources:
  - from: resources
    to: .
    filter:
      - app-config.json
      - policy_pubkey.pem
      - icon.ico

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Whitz-${version}-${arch}.${ext}
  # 生产签名：设置 CSC_LINK / CSC_KEY_PASSWORD 环境变量后由 electron-builder 自动签名

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Whitz
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

publish:
  provider: generic
  url: https://whitz.fiacloud.top/desktop
  channel: latest
