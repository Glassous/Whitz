name: Deploy Server

# 流程：GitHub Runner 构建镜像 → docker save + gzip → SCP 直传服务器2 → docker load + up
# 不依赖任何镜像仓库；服务器2 只做 load，绝不执行 build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  LOCAL_IMAGE: whitz-server
  LOCAL_ARCHIVE: server-image.tar.gz
  REMOTE_ARCHIVE: /tmp/whitz-server.tar.gz
  REMOTE_DIR: /opt/whitz
  COMPOSE_FILE: docker-compose.prod.yml
  PROJECT: whitz

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export & compress
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE:${{ steps.meta.outputs.tag }}" >/dev/null
          docker save "$LOCAL_IMAGE:${{ steps.meta.outputs.tag }}" | gzip -1 > "$LOCAL_ARCHIVE"
          ls -lh "$LOCAL_ARCHIVE"
          echo "size=$(du -m "$LOCAL_ARCHIVE" | cut -f1)MB"

      - name: Upload image to server2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.LOCAL_ARCHIVE }}
          target: /tmp
          overwrite: true
          timeout: 300s

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          timeout: 60s

      - name: Load & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.LOCAL_IMAGE }}:${{ steps.meta.outputs.tag }}
          REPO: ${{ env.LOCAL_IMAGE }}
          ARCHIVE: ${{ env.REMOTE_ARCHIVE }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          PROJECT: ${{ env.PROJECT }}
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          command_timeout: 15m
          envs: TAG,IMAGE,REPO,ARCHIVE,REMOTE_DIR,COMPOSE_FILE,PROJECT
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            test -f .env || { echo "缺少 $REMOTE_DIR/.env（参考 .env.example 手工创建）"; exit 1; }

            # 权限自检：SSH 用户必须能免 sudo 使用 docker
            if ! docker info >/dev/null 2>&1; then
              echo "当前用户无 docker 权限：sudo usermod -aG docker $(id -un) 后重新登录"
              exit 1
            fi

            test -f "$ARCHIVE" || { echo "镜像包未上传成功：$ARCHIVE"; exit 1; }
            echo "loading $ARCHIVE"
            gunzip -c "$ARCHIVE" | docker load
            rm -f "$ARCHIVE"

            export WHITZ_SERVER_IMAGE="$IMAGE"
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            ok=0
            for i in $(seq 1 40); do
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T server \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "健康检查失败，最近日志："
              docker compose -p "$PROJECT" -f "$COMPOSE_FILE" logs --tail=100 server || true
              exit 1
            fi

            # 清理旧的 sha tag（保留本次与 latest），旧镜像层共享，不会影响运行中的容器
            docker images "$REPO" --format '{{.Tag}}' \
              | grep -vE "^(${TAG}|latest)$" \
              | xargs -r -I{} docker rmi "$REPO:{}" >/dev/null 2>&1 || true
            docker image prune -f --filter "dangling=true" >/dev/null 2>&1 || true

            echo "server deployed: $IMAGE @ $(date -u +%FT%TZ)"
