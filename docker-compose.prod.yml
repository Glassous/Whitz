# 生产环境编排（服务器2）：只拉取 CI 构建好的镜像，不在服务器上构建
# 用法：cd /opt/whitz && docker compose -f docker-compose.prod.yml up -d
# 依赖宿主机 .env（同目录），镜像 tag 由 GitHub Actions 通过 WHITZ_SERVER_IMAGE / WHITZ_AGENT_IMAGE 注入
services:
  postgres:
    # 拉不到时可换成镜像加速域名，例如 docker.m.daocloud.io/pgvector/pgvector:pg17
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: whitz-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
      - -c
      - min_wal_size=128MB
      - -c
      - max_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whitz_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-whitz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whitz} -d ${POSTGRES_DB:-whitz}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5434:5432"
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - whitz_net

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: whitz-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 32mb
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 320m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - whitz_net

  # 一次性任务：共享数据卷由 dockerd 以 root:root 创建，而 server 以 1000:1000
  # 只读根文件系统运行，若不预先建目录并移交属主，上传头像会因 EACCES 返回 500。
  # 复用 server 镜像（部署前已 pull），避免生产环境再拉取新镜像失败。
  app-data-init:
    image: ${WHITZ_SERVER_IMAGE:-ghcr.io/glassous/whitz-server:latest}
    container_name: whitz-app-data-init
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - "mkdir -p /app-data/avatars && chown 1000:1000 /app-data /app-data/avatars"
    volumes:
      - app_data:/app-data
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  agent-api:
    # 镜像由 GitHub Actions 构建并推送，部署脚本注入 WHITZ_AGENT_IMAGE
    image: ${WHITZ_AGENT_IMAGE:-ghcr.io/glassous/whitz-agent:latest}
    container_name: whitz-agent-api
    restart: unless-stopped
    environment: &agent-env
      APP_ENV: ${APP_ENV:-production}
      AGENT_ROLE: api
      AGENT_PORT: "8642"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whitz}:${POSTGRES_PASSWORD:-whitz_dev_password}@postgres:5432/${POSTGRES_DB:-whitz}
      REDIS_URL: redis://redis:6379/0
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      INTERNAL_MCP_BASE_URL: ${INTERNAL_MCP_BASE_URL:-http://server:8000}
      APP_DATA_DIR: ${APP_DATA_DIR:-/app-data}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_SUPPORTS_VISION: ${LLM_SUPPORTS_VISION:-true}
      LLM_FAST_BASE_URL: ${LLM_FAST_BASE_URL:-}
      LLM_FAST_API_KEY: ${LLM_FAST_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_REASONING_BASE_URL: ${LLM_REASONING_BASE_URL:-}
      LLM_REASONING_API_KEY: ${LLM_REASONING_API_KEY:-}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-}
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-auto}
      LLM_THINKING_PARAM_STYLE: ${LLM_THINKING_PARAM_STYLE:-auto}
      LLM_ADAPTIVE_PROBE_ENABLED: ${LLM_ADAPTIVE_PROBE_ENABLED:-true}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TOP_N: ${RERANK_TOP_N:-8}
      SANDBOX_MODE: ${SANDBOX_MODE:-disabled}
      E2B_API_KEY: ${E2B_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      RUN_MAX_SECONDS: ${RUN_MAX_SECONDS:-1200}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-whitz}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - app_data:/app-data
    expose:
      - "8642"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    cap_drop:
      - ALL
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - whitz_net

  agent-worker:
    image: ${WHITZ_AGENT_IMAGE:-ghcr.io/glassous/whitz-agent:latest}
    container_name: whitz-agent-worker
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_ROLE: worker
    volumes:
      - app_data:/app-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, redis; r = redis.Redis.from_url(os.environ['REDIS_URL'], decode_responses=True); v = r.get('agent:worker:heartbeat'); assert v and (time.time() - float(v)) < 45"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    cap_drop:
      - ALL
    mem_limit: 1024m
    memswap_limit: 1280m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - whitz_net

  server:
    # 镜像由 GitHub Actions 构建并推送 GHCR，部署脚本注入具体 tag
    image: ${WHITZ_SERVER_IMAGE:-ghcr.io/glassous/whitz-server:latest}
    container_name: whitz-server
    restart: unless-stopped
    user: "1000:1000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whitz}:${POSTGRES_PASSWORD:-whitz_dev_password}@postgres:5432/${POSTGRES_DB:-whitz}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-15}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_SUPPORTS_VISION: ${LLM_SUPPORTS_VISION:-true}
      LLM_FAST_BASE_URL: ${LLM_FAST_BASE_URL:-}
      LLM_FAST_API_KEY: ${LLM_FAST_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_REASONING_BASE_URL: ${LLM_REASONING_BASE_URL:-}
      LLM_REASONING_API_KEY: ${LLM_REASONING_API_KEY:-}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-}
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-auto}
      LLM_THINKING_PARAM_STYLE: ${LLM_THINKING_PARAM_STYLE:-auto}
      LLM_ADAPTIVE_PROBE_ENABLED: ${LLM_ADAPTIVE_PROBE_ENABLED:-true}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TOP_N: ${RERANK_TOP_N:-8}
      AGENT_BASE_URL: http://agent-api:8642
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      APP_DATA_DIR: ${APP_DATA_DIR:-/app-data}
      SANDBOX_MODE: ${SANDBOX_MODE:-disabled}
      E2B_API_KEY: ${E2B_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-whitz}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      SKILLS_BUILTIN_ALLOWLIST: ${SKILLS_BUILTIN_ALLOWLIST:-}
      SKILLS_BUILTIN_DENYLIST: ${SKILLS_BUILTIN_DENYLIST:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://whitz.fiacloud.top,https://whitzadmin.vodyanitsa.top}
      # 反代域名必须在这里，127.0.0.1 供容器内健康检查使用
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-whitzapi.kamisato.top,127.0.0.1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      MAX_CONCURRENT_RUNS_PER_USER: ${MAX_CONCURRENT_RUNS_PER_USER:-2}
      MAX_SSE_STREAMS: ${MAX_SSE_STREAMS:-32}
      MAX_SSE_STREAMS_PER_USER: ${MAX_SSE_STREAMS_PER_USER:-8}
      RUN_MAX_SECONDS: ${RUN_MAX_SECONDS:-1200}
      CHAT_RATE_PER_MINUTE: ${CHAT_RATE_PER_MINUTE:-30}
      TOKENS_PER_CREDIT: ${TOKENS_PER_CREDIT:-5000}
      MEMBERSHIP_DEFAULT_DAYS: ${MEMBERSHIP_DEFAULT_DAYS:-30}
      STRICT_TICKET_IP: ${STRICT_TICKET_IP:-false}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Whitz}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_CODE_TTL_SECONDS: ${EMAIL_CODE_TTL_SECONDS:-600}
      EMAIL_CODE_COOLDOWN_SECONDS: ${EMAIL_CODE_COOLDOWN_SECONDS:-60}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_PUBLIC_HOST: ${COS_PUBLIC_HOST:-}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-whitz/uploads}
      COS_USE_STS: ${COS_USE_STS:-false}
      COS_STS_DURATION_SECONDS: ${COS_STS_DURATION_SECONDS:-900}
      COS_UPLOAD_EXPIRES_SECONDS: ${COS_UPLOAD_EXPIRES_SECONDS:-600}
      COS_DOWNLOAD_EXPIRES_SECONDS: ${COS_DOWNLOAD_EXPIRES_SECONDS:-300}
      COS_IMAGE_THUMB_QUERY: ${COS_IMAGE_THUMB_QUERY:-}
      PENDING_FILE_TTL_SECONDS: ${PENDING_FILE_TTL_SECONDS:-1800}
      FILE_MAX_SIZE_MB: ${FILE_MAX_SIZE_MB:-20}
      MAX_FILES_PER_CONVERSATION: ${MAX_FILES_PER_CONVERSATION:-20}
      INTERNAL_MCP_BASE_URL: ${INTERNAL_MCP_BASE_URL:-http://server:8000}
      DESKTOP_ORIGINS: ${DESKTOP_ORIGINS:-app://whitz}
      DESKTOP_WORK_MODE_ENABLED: ${DESKTOP_WORK_MODE_ENABLED:-true}
      DESKTOP_WORK_DISABLED_REASON: ${DESKTOP_WORK_DISABLED_REASON:-}
      DESKTOP_MIN_APP_VERSION: ${DESKTOP_MIN_APP_VERSION:-0.1.0}
      DESKTOP_LATEST_APP_VERSION: ${DESKTOP_LATEST_APP_VERSION:-}
      DESKTOP_POLICY_TTL_MINUTES: ${DESKTOP_POLICY_TTL_MINUTES:-360}
      DESKTOP_POLICY_PRIVATE_KEY: ${DESKTOP_POLICY_PRIVATE_KEY:-}
      DESKTOP_POLICY_KEY_ID: ${DESKTOP_POLICY_KEY_ID:-desktop-1}
      DESKTOP_LLM_MODEL_ALIAS: ${DESKTOP_LLM_MODEL_ALIAS:-whitz-default}
      DESKTOP_LLM_UPSTREAM_MODEL: ${DESKTOP_LLM_UPSTREAM_MODEL:-}
      DESKTOP_LLM_MAX_TOKENS: ${DESKTOP_LLM_MAX_TOKENS:-8192}
      DESKTOP_LLM_BASE_URL: ${DESKTOP_LLM_BASE_URL:-}
      DESKTOP_LLM_REQUEST_TIMEOUT_SECONDS: ${DESKTOP_LLM_REQUEST_TIMEOUT_SECONDS:-300}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - app_data:/app-data
    ports:
      # 1Panel 的 OpenResty 若不在 host 网络，把 SERVER_BIND_IP 改成宿主机内网 IP
      # （例如 172.17.0.1）或 docker0 网关地址
      - "${SERVER_BIND_IP:-127.0.0.1}:${SERVER_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    logging: *default-logging
    networks:
      - whitz_net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: whitz-prometheus
    profiles: ["ops"]
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - whitz_net

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: whitz-grafana
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-whitz_grafana}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - whitz_net

volumes:
  postgres_data:
  redis_data:
  app_data:
  prometheus_data:
  grafana_data:

networks:
  whitz_net:
    driver: bridge
