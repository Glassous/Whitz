name: CI Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ${{ matrix.app }} typecheck & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin, desktop]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  shared:
    name: shared (whitz_rag) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        working-directory: shared
        run: |
          python -m pip install pytest pytest-asyncio httpx
          python -m pytest tests -q

  server:
    name: server tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: whitz
          POSTGRES_PASSWORD: whitz_dev_password
          POSTGRES_DB: whitz
        # tests/conftest.py connects to localhost:5434
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U whitz -d whitz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        working-directory: server
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: server
        run: python -m pytest -q

  agent:
    name: agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install
        working-directory: agent
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: agent
        run: python -m pytest -q
