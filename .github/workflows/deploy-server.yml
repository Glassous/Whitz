name: Deploy Server

# 流程：GitHub Runner 构建 Docker 镜像 → 推送 GHCR → 服务器2 只做 pull + up
# 服务器2 永远不执行 docker build

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # 注意：镜像名必须全小写
  IMAGE: ghcr.io/glassous/whitz-server
  REMOTE_DIR: /opt/whitz
  COMPOSE_FILE: docker-compose.prod.yml
  PROJECT: whitz

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Restart on Server2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file to server2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          timeout: 60s

      - name: Pull image & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          PROJECT: ${{ env.PROJECT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER2_SSH_KEY }}
          port: ${{ secrets.SERVER2_PORT || 22 }}
          command_timeout: 15m
          envs: IMAGE,REMOTE_DIR,COMPOSE_FILE,PROJECT,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            test -f .env || { echo "缺少 $REMOTE_DIR/.env（参考 .env.example 手工创建）"; exit 1; }

            # 权限自检：SSH 用户必须能免 sudo 使用 docker
            if ! docker info >/dev/null 2>&1; then
              echo "当前用户无 docker 权限：sudo usermod -aG docker $(id -un) 后重新登录"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WHITZ_SERVER_IMAGE="$IMAGE"

            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" pull server
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            ok=0
            for i in $(seq 1 40); do
              if docker compose -p "$PROJECT" -f "$COMPOSE_FILE" exec -T server \
                python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)" \
                >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "健康检查失败，最近日志："
              docker compose -p "$PROJECT" -f "$COMPOSE_FILE" logs --tail=100 server || true
              exit 1
            fi

            docker image prune -f --filter "dangling=true" >/dev/null 2>&1 || true
            echo "server deployed: $IMAGE @ $(date -u +%FT%TZ)"
